name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  stress-tests:
    name: Stress tests (release gate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dev and demos dependencies
        run: uv sync --dev --extra demos

      - name: Run pytest stress loop
        shell: bash
        run: |
          loops="10"
          for i in $(seq 1 "$loops"); do
            echo "== stress run $i/$loops =="
            uv run pytest -q
          done

  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          release_version="${RELEASE_TAG#v}"
          if [ "$release_version" != "$package_version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv run --with build python -m build

      - name: Show built distributions
        run: |
          echo "Built distributions:"
          ls -lh dist

      - name: Smoke test built distributions
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          ./scripts/smoke_package.sh "$(find dist -name '*.whl' -print -quit)" "$package_version"
          ./scripts/smoke_package.sh "$(find dist -name '*.tar.gz' -print -quit)" "$package_version"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build, stress-tests]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/context-compiler

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
